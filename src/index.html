<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' file: capa: https: data:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file:; script-src 'self' file:; frame-src https://www.youtube-nocookie.com">
  <title>nandflix</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/montserrat/400.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/montserrat/500.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/montserrat/600.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/montserrat/700.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/montserrat/800.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo" id="topo">
    <div class="topo-linha">
      <div class="topo-esq">
        <h1 class="marca"><img class="marca-icone" src="icone.png" alt=""> nandflix</h1>
        <button class="btn btn-fantasma btn-capas" id="btn-capas-faltam" hidden></button>
      </div>
      <div class="topo-dir">
        <div class="pesquisa" id="pesquisa-caixa">
          <input id="pesquisa" type="search" placeholder="Título, ano, diretor ou notas" autocomplete="off" spellcheck="false" tabindex="-1" aria-label="Pesquisar filmes">
          <button class="icone-btn" id="btn-lupa" data-dica="Pesquisar" aria-label="Pesquisar"><span data-icone="Search"></span></button>
        </div>
        <!-- Menus: a seta abre (ao passar o mouse ou clicar) a lista com ícone e nome. -->
        <div class="menu-topo" id="menu-topo">
          <button class="icone-btn menu-topo-seta" id="btn-menu-topo" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-topo-lista" aria-label="Menus"><span data-icone="ChevronDown"></span></button>
          <div class="menu-topo-lista" id="menu-topo-lista" role="menu" aria-label="Menus">
            <button class="menu-topo-item" role="menuitem" id="btn-paleta"><span data-icone="Search"></span><span>Buscar em tudo</span><kbd>Ctrl K</kbd></button>
            <span class="menu-topo-sep" aria-hidden="true"></span>
            <button class="menu-topo-item" role="menuitem" id="btn-calendario"><span data-icone="CalendarDays"></span><span>Calendário</span></button>
            <button class="menu-topo-item" role="menuitem" id="btn-paginas"><span data-icone="NotebookPen"></span><span>Suas páginas</span></button>
            <button class="menu-topo-item" role="menuitem" id="btn-tierlist"><span data-icone="Medal"></span><span>Tierlist</span></button>
            <button class="menu-topo-item" role="menuitem" id="btn-estatisticas"><span data-icone="ChartColumn"></span><span>Estatísticas</span></button>
            <div class="sortear-topo" id="sortear-topo" role="none">
              <span class="menu-topo-sep" aria-hidden="true"></span>
              <button class="menu-topo-item" role="menuitem" id="btn-sortear"><span data-icone="Dices"></span><span>Sortear</span><kbd>R</kbd></button>
              <button class="menu-topo-item sortear-filtros" role="menuitem" id="btn-sortear-filtro"><span data-icone="SlidersHorizontal"></span><span class="sortear-filtros-texto">Sortear com filtro</span></button>
            </div>
          </div>
        </div>
        <button class="icone-btn btn-mais" id="btn-adicionar" data-dica="Adicionar filme" aria-label="Adicionar filme"><span data-icone="Plus"></span></button>
        <button class="icone-btn" id="btn-config" data-dica="Configurações" aria-label="Configurações"><span data-icone="Settings"></span></button>
      </div>
    </div>
    <div class="progresso-capas" id="progresso-capas" hidden>
      <div class="progresso-trilho"><div class="progresso-cheio" id="progresso-cheio"></div></div>
      <span id="progresso-texto"></span>
    </div>
  </header>

  <main id="principal">
    <section class="bloco" id="secao-sorteado" hidden>
      <h2 class="titulo-secao sr">Filme sorteado</h2>
      <section class="destaque" id="destaque" aria-label="Filme sorteado"></section>
    </section>

    <section class="bloco" id="secao-favoritos" hidden>
      <div class="cabecalho-fileira">
        <h2 class="titulo-secao">Filmes na sua lista</h2>
        <span class="divisor-v" aria-hidden="true"></span>
        <span class="kicker" id="kicker-favoritos">0 favoritos</span>
      </div>
      <div class="fileira-envoltorio">
        <button class="fileira-seta fileira-esq" id="fileira-esq" aria-label="Voltar"><span data-icone="ChevronLeft"></span></button>
        <div class="fileira" id="fileira"></div>
        <button class="fileira-seta fileira-dir" id="fileira-dir" aria-label="Mostrar mais"><span data-icone="ChevronRight"></span></button>
      </div>
    </section>

    <section class="bloco" id="secao-todos">
      <div class="cabecalho-secao" id="titulo-todos" hidden>
        <div class="cabecalho-titulos">
          <h2 class="titulo-secao">Todos os filmes</h2>
        </div>
        <div class="estatisticas" id="estatisticas">
          <div class="est-vistos">
            <span id="est-vistos-texto">0 de 0 vistos (0%)</span>
            <div class="barra" aria-hidden="true"><div class="barra-cheia" id="est-barra"></div></div>
          </div>
          <span class="est-fav"><span data-icone="Star" data-preenchido></span><span id="est-fav">0 favoritos</span></span>
        </div>
      </div>
      <div class="barra-ferramentas" id="barra-ferramentas" hidden>
        <div class="chips" role="radiogroup" aria-label="Filtro">
          <button class="chip ativo" data-filtro="todos" role="radio" aria-checked="true">Todos</button>
          <button class="chip" data-filtro="nao-vistos" role="radio" aria-checked="false">Não vistos</button>
          <button class="chip" data-filtro="vistos" role="radio" aria-checked="false">Vistos</button>
          <button class="chip" data-filtro="favoritos" role="radio" aria-checked="false">★ Favoritos</button>
        </div>
        <button class="chip chip-diretor" id="chip-diretor" title="Tirar o filtro de diretor" hidden></button>
        <button class="chip chip-diretor" id="chip-pais" title="Tirar o filtro de país" hidden></button>
        <button class="chip chip-diretor" id="chip-lista" title="Tirar o filtro de lista" hidden></button>
        <button class="chip chip-listas" id="btn-listas" aria-haspopup="menu"><span data-icone="Tags"></span>Listas<span data-icone="ChevronDown"></span></button>
        <span class="contagem" id="contagem"></span>
        <div class="espaco"></div>
        <label class="ordenar">
          <span>Ordenar por</span>
          <span class="ordenar-caixa">
            <select id="ordenacao">
              <option value="ordem">Ordem original</option>
              <option value="titulo">Título</option>
              <option value="ano">Ano</option>
              <option value="diretor">Diretor</option>
              <option value="pais">País</option>
              <option value="recentes">Adicionados recentemente</option>
            </select>
            <span class="ordenar-seta" data-icone="ChevronDown"></span>
          </span>
        </label>
        <div class="alternar-vista" role="group" aria-label="Visualização">
          <button class="btn btn-icone" data-vista="grade" title="Grade de capas" aria-label="Grade de capas"><span data-icone="LayoutGrid"></span></button>
          <button class="btn btn-icone" data-vista="lista" title="Lista compacta" aria-label="Lista compacta"><span data-icone="List"></span></button>
        </div>
      </div>

      <section class="vazio" id="vazio" hidden>
        <div class="vazio-caixa">
          <h2>Sua lista está vazia</h2>
          <div class="vazio-acoes">
            <button class="btn btn-primario btn-grande" id="btn-importar-vazio">Importar planilha</button>
            <div class="vazio-dir">
              <button class="link-forte" id="btn-adicionar-vazio">ou adicione um filme</button>
              <p>Importe a planilha de filmes para começar. Os vistos, favoritos e notas vêm junto.</p>
            </div>
          </div>
        </div>
      </section>

      <section class="sem-resultados" id="sem-resultados" hidden>
        <h3 class="sem-titulo">Nenhum filme encontrado.</h3>
        <button class="btn btn-primario sem-adicionar" id="btn-sem-adicionar" hidden></button>
        <div class="sem-rodape">
          <span>Busque por título, ano, diretor ou notas.</span>
          <span id="sem-contagem"></span>
        </div>
      </section>

      <div id="lista" class="lista grade"></div>
    </section>
  </main>

  <aside class="painel" id="painel" aria-hidden="true" aria-label="Detalhes do filme">
    <div class="painel-conteudo" id="painel-conteudo"></div>
  </aside>
  <div class="painel-fundo" id="painel-fundo"></div>

  <div class="previa" id="previa" hidden></div>

  <div class="calendario" id="calendario" hidden>
    <div class="calendario-caixa" id="calendario-caixa" role="dialog" aria-modal="true" aria-label="Calendário"></div>
  </div>

  <div class="calendario tierlist" id="tierlist" hidden>
    <div class="calendario-caixa tierlist-caixa" id="tierlist-caixa" role="dialog" aria-modal="true" aria-label="Tierlist"></div>
  </div>

  <div class="calendario retrospectiva" id="retrospectiva" hidden>
    <div class="calendario-caixa retrospectiva-caixa" id="retrospectiva-caixa" role="dialog" aria-modal="true" aria-label="Estatísticas"></div>
  </div>

  <div class="calendario paginas" id="paginas" hidden>
    <div class="calendario-caixa paginas-caixa" id="paginas-caixa" role="dialog" aria-modal="true" aria-label="Suas páginas"></div>
  </div>

  <div class="calendario pagina-filme" id="pagina-filme" hidden>
    <div class="calendario-caixa pagina-caixa" id="pagina-caixa" role="dialog" aria-modal="true" aria-label="Sua página do filme"></div>
  </div>

  <div class="foco" id="foco" hidden>
    <div class="foco-caixa" id="foco-caixa"></div>
  </div>

  <dialog id="modal" class="modal"></dialog>

  <div class="avisos" id="avisos" role="status" aria-live="polite"></div>

  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="icones.js"></script>
  <script src="movimento.js"></script>
  <script src="entrada.js"></script>
  <script src="app.js"></script>
  <script src="pagina.js"></script>
  <script src="story.js"></script>
  <script src="listas.js"></script>
  <script src="retro.js"></script>
  <script src="busca.js"></script>
</body>
</html>
